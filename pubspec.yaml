name: rustler_gx
description: "RigOS - Local-first vehicle, caravan, camping and energy control platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Bluetooth / Victron
  flutter_blue_plus: ^2.3.11
  permission_handler: ^12.0.1

  # Storage / settings
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  file_picker: ^12.1.1

  # Crypto
  pointycastle: ^4.0.0

  # Charts
  fl_chart: ^1.2.0

  # GPS
  geolocator: ^14.0.2

  # Android integrations
  android_intent_plus: ^6.0.0

  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Existing raster MBTiles support
  # Offline vector maps
  flutter_map_vector_tiles: ^2.0.0
  flutter_map_vector_tiles_mbtiles: ^1.0.0

  # Local databases
  sqlite3: ^3.1.1

  # A* routing priority queue
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/map_styles/rustler_dark.json